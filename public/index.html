<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMA Digital Strategy Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8f9fa; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-responsive { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        /* ตกแต่งแถว KR ให้เด่นขึ้น */
        .kr-row { background-color: #e9ecef !important; font-weight: bold; cursor: pointer; }
        .kr-row:hover { background-color: #dee2e6 !important; }
        .project-row { transition: all 0.3s; }
        
        /* สัญลักษณ์ เปิด/ปิด แถว */
        .toggle-icon::before { content: "▼"; display: inline-block; margin-right: 8px; font-size: 0.8em; color: #6c757d; }
        .kr-row.collapsed .toggle-icon::before { content: "▶"; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold">📍 Dashboard ยุทธศาสตร์ สดท.</span>
        <select id="yearSelect" class="form-select w-auto" onchange="fetchData()">
            <option value="2570">ปีงบประมาณ 2570</option>
            <option value="2571">ปีงบประมาณ 2571</option>
        </select>
    </div>
</nav>

<div class="container-fluid py-4 px-4">
    <div id="loading" class="text-center my-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3 fw-bold text-muted">กำลังซิงค์ข้อมูลล่าสุด...</p>
    </div>

    <div id="dashboardContent" class="d-none">
        
        <div class="row mb-3">
            <div class="col-md-3">
                <label class="form-label fw-bold text-muted">กรองตามหน่วยงาน (R)</label>
                <select id="deptFilter" class="form-select" onchange="applyFilters()">
                    <option value="all">แสดงทั้งหมด</option>
                </select>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card card-custom bg-white border-start border-primary border-4 h-100">
                    <div class="card-body">
                        <p class="text-muted mb-1 fw-bold">จำนวน KRs ทั้งหมด</p>
                        <h2 id="totalKRs" class="mb-0 text-primary">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-custom bg-white border-start border-info border-4 h-100">
                    <div class="card-body">
                        <p class="text-muted mb-1 fw-bold">จำนวนโครงการ</p>
                        <h2 id="totalProjects" class="mb-0 text-info">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-custom bg-white border-start border-success border-4 h-100">
                    <div class="card-body">
                        <p class="text-muted mb-1 fw-bold">งบประมาณรวม</p>
                        <h2 id="totalBudget" class="mb-0 text-success">0 <small class="fs-6 text-muted">บาท</small></h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-custom bg-white border-start border-warning border-4 h-100">
                    <div class="card-body">
                        <p class="text-muted mb-1 fw-bold">เบิกจ่ายสะสม</p>
                        <h2 id="totalSpent" class="mb-0 text-warning">0 <small class="fs-6 text-muted">บาท</small></h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. ตารางข้อมูลแบบซ้อน (Nested Table) -->
        <div class="table-responsive">
            <h5 class="fw-bold mb-3">ความเชื่อมโยงยุทธศาสตร์ (KRs) และ โครงการ</h5>
            <table class="table table-bordered align-middle">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 40%;">ยุทธศาสตร์ / โครงการ</th>
                        <th>หน่วยงานรับผิดชอบ</th>
                        <th>ผลสำเร็จ (%)</th>
                        <th>งบประมาณ (บาท)</th>
                        <th>เอกสารหลักฐาน</th>
                    </tr>
                </thead>
                <tbody id="projectTableBody">
                    <!-- โค้ดสร้างตารางจะถูกใส่ตรงนี้ -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let globalData = [];
    let krGroups = {}; 

    async function fetchData() {
        const year = document.getElementById('yearSelect').value;
        document.getElementById('loading').classList.remove('d-none');
        document.getElementById('dashboardContent').classList.add('d-none');

        try {
            const response = await fetch(`/api/data?year=${year}`);
            const result = await response.json();
            
            if(result.status === 'success') {
                globalData = result.data;
                populateFilters(globalData);
                applyFilters(); 
            } else {
                alert("เกิดข้อผิดพลาดจาก Backend: " + result.error);
            }
        } catch (error) {
            console.error(error);
            alert("ไม่สามารถเชื่อมต่อดึงข้อมูลได้");
        } finally {
            document.getElementById('loading').classList.add('d-none');
            document.getElementById('dashboardContent').classList.remove('d-none');
        }
    }

    // หาชื่อคอลัมน์แบบยืดหยุ่น (แก้ปัญหาการขึ้นบรรทัดใหม่)
    function getColNames(row) {
        const keys = Object.keys(row);
        return {
            krID: keys.find(k => k.includes('รหัส KRs')) || keys[1],
            krName: keys.find(k => k.includes('KEY RESULT')) || keys[5],
            projectName: keys.find(k => k.includes('โครงการ/กิจกรรม') && k.includes('หน่วยงาน')) || keys[14],
            dept: keys.find(k => k.includes('หน่วยงาน (R)')) || keys[9],
            budget: keys.find(k => k.includes('งบประมาณจัดสรร')) || keys[19],
            spent: keys.find(k => k.includes('ผลการเบิกจ่ายจริง')) || keys[20],
            target: keys.find(k => k.includes('ค่าเป้าหมายของโครงการ')) || keys[16],
            actual: keys.find(k => k.includes('ผลการดำเนินงานตามค่าเป้าหมายของโครงการ')) || keys[18],
            doc: keys.find(k => k.includes('ลิงก์ไฟล์เอกสาร')) || keys[22]
        };
    }

    function populateFilters(data) {
        if(data.length === 0) return;
        const cols = getColNames(data[0]);
        const deptSelect = document.getElementById('deptFilter');
        const depts = new Set();
        
        data.forEach(row => {
            let dept = row[cols.dept];
            if(dept && String(dept).trim() !== '') depts.add(String(dept).trim());
        });

        deptSelect.innerHTML = '<option value="all">แสดงทั้งหมด</option>';
        depts.forEach(dept => {
            let option = document.createElement('option');
            option.value = dept;
            option.innerText = dept;
            deptSelect.appendChild(option);
        });
    }

    function applyFilters() {
        const selectedDept = document.getElementById('deptFilter').value;
        if(globalData.length === 0) return;
        
        const cols = getColNames(globalData[0]);
        let filteredData = globalData;
        
        // กรองเฉพาะโครงการ (KR จะแสดงเสมอเพื่อเป็นโครงร่าง)
        if (selectedDept !== 'all') {
            filteredData = globalData.filter(row => {
                let pName = String(row[cols.projectName] || '').trim();
                let deptName = String(row[cols.dept] || '').trim();
                // อนุญาตให้ผ่านถ้าเป็นแถว KR ว่างเปล่า (ไม่มีชื่อโครงการ) หรือเป็นโครงการที่ตรงกับ Filter
                return pName === '' || deptName === selectedDept;
            });
        }

        processDashboardData(filteredData, cols);
    }

    function processDashboardData(data, cols) {
        let totalBudget = 0;
        let totalSpent = 0;
        let totalProjectsCount = 0;
        
        krGroups = {}; // รีเซ็ตการจัดกลุ่ม

        // 1. จัดกลุ่มข้อมูลตาม KR
        data.forEach((row, index) => {
            // หากไม่มีชื่อ KR ถือเป็นแถวว่าง ให้ข้ามไป
            let krTitle = String(row[cols.krName] || '').trim();
            if(!krTitle || krTitle === 'NaN' || krTitle === 'None') return;

            // ใช้ชื่อ KR เป็น Key เพื่อจัดกลุ่ม (กรณี รหัส KR ว่าง)
            let krKey = row[cols.krID] || krTitle; 
            
            if(!krGroups[krKey]) {
                krGroups[krKey] = {
                    title: krTitle,
                    id: row[cols.krID] || 'ไม่มีรหัส',
                    projects: [],
                    krBudget: 0,
                    krSpent: 0
                };
            }

            // ตรวจสอบว่าบรรทัดนี้มี โครงการ หรือไม่
            let pName = String(row[cols.projectName] || '').trim();
            if(pName && pName !== 'NaN' && pName !== 'None') {
                let pBudget = parseFloat(String(row[cols.budget] || '0').replace(/,/g, '')) || 0;
                let pSpent = parseFloat(String(row[cols.spent] || '0').replace(/,/g, '')) || 0;
                
                totalBudget += pBudget;
                totalSpent += pSpent;
                totalProjectsCount++;
                
                krGroups[krKey].krBudget += pBudget;
                krGroups[krKey].krSpent += pSpent;

                let pTarget = parseFloat(row[cols.target]) || 1;
                let pActual = parseFloat(row[cols.actual]) || 0;
                let pProgress = Math.min((pActual / pTarget) * 100, 100).toFixed(2);

                krGroups[krKey].projects.push({
                    name: pName,
                    dept: row[cols.dept] || '-',
                    budget: pBudget,
                    progress: isNaN(pProgress) ? 0 : pProgress,
                    doc: row[cols.doc]
                });
            }
        });

        // 2. สร้าง HTML ตาราง
        let tableHTML = '';
        let krCount = 0;

        for (const key in krGroups) {
            krCount++;
            const group = krGroups[key];
            const hasProjects = group.projects.length > 0;
            const krRowId = `kr-${krCount}`;

            // แถวหัวข้อ KR
            tableHTML += `
                <tr class="kr-row ${hasProjects ? '' : 'text-danger'}" onclick="toggleKR('${krRowId}')">
                    <td colspan="3">
                        <span class="toggle-icon"></span>
                        <span class="badge bg-secondary me-2">${group.id}</span>
                        ${group.title}
                        ${!hasProjects ? '<span class="badge bg-danger ms-2">ยังไม่มีโครงการรองรับ</span>' : ''}
                    </td>
                    <td class="text-end fw-bold">${group.krBudget.toLocaleString()}</td>
                    <td></td>
                </tr>
            `;

            // แถวโครงการย่อย (ซ่อนอยู่ใต้ KR)
            group.projects.forEach(proj => {
                let docButton = proj.doc && String(proj.doc).startsWith('http') 
                    ? `<a href="${proj.doc}" target="_blank" class="btn btn-sm btn-outline-primary">📂 เอกสาร</a>`
                    : `<span class="text-muted" style="font-size:0.85em;">ไม่มีไฟล์</span>`;

                tableHTML += `
                    <tr class="project-row kr-child-${krRowId}">
                        <td class="ps-5 text-primary">↳ ${proj.name}</td>
                        <td>${proj.dept}</td>
                        <td>
                            <div class="d-flex align-items-center">
                                <span class="me-2">${proj.progress}%</span>
                                <div class="progress w-100" style="height: 6px;">
                                    <div class="progress-bar ${proj.progress == 100 ? 'bg-success' : 'bg-primary'}" style="width: ${proj.progress}%;"></div>
                                </div>
                            </div>
                        </td>
                        <td class="text-end">${proj.budget.toLocaleString()}</td>
                        <td class="text-center">${docButton}</td>
                    </tr>
                `;
            });
        }

        // อัปเดต Card สรุปผล
        document.getElementById('totalKRs').innerText = krCount;
        document.getElementById('totalProjects').innerText = totalProjectsCount;
        document.getElementById('totalBudget').innerText = totalBudget.toLocaleString();
        document.getElementById('totalSpent').innerText = totalSpent.toLocaleString();
        
        document.getElementById('projectTableBody').innerHTML = tableHTML;
    }

    // ฟังก์ชันสำหรับ กดพับ/กาง แถวโครงการ
    function toggleKR(krId) {
        const krRow = document.querySelector(`tr[onclick="toggleKR('${krId}')"]`);
        krRow.classList.toggle('collapsed');
        
        const children = document.querySelectorAll(`.kr-child-${krId}`);
        children.forEach(child => {
            if (krRow.classList.contains('collapsed')) {
                child.style.display = 'none';
            } else {
                child.style.display = 'table-row';
            }
        });
    }

    window.onload = fetchData;
</script>

</body>
</html>
