<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMA Digital Strategy Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8f9fa; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-responsive { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        .kr-row { background-color: #f1f3f5 !important; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .kr-row:hover { background-color: #e9ecef !important; }
        .toggle-icon::before { content: "▼"; display: inline-block; margin-right: 8px; font-size: 0.8em; color: #6c757d; }
        .kr-row.collapsed .toggle-icon::before { content: "▶"; }
        
        .badge-host { background-color: #0d6efd; color: white; } /* สีน้ำเงิน H */
        .badge-relative { background-color: #fd7e14; color: white; } /* สีส้ม R */
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-bold">📍 Dashboard ยุทธศาสตร์ สดท.</span>
        <select id="yearSelect" class="form-select w-auto" onchange="fetchData()">
            <option value="2570">ปีงบประมาณ 2570</option>
            <option value="2571">ปีงบประมาณ 2571</option>
        </select>
    </div>
</nav>

<div class="container-fluid py-4 px-4">
    <div id="loading" class="text-center my-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3 fw-bold text-muted">กำลังซิงค์ข้อมูลล่าสุด...</p>
    </div>

    <div id="dashboardContent" class="d-none">
        
        <!-- ตัวกรองบทบาทของ สดท. (H / R) -->
        <div class="row mb-4 align-items-end">
            <div class="col-md-6">
                <label class="form-label fw-bold text-muted">บทบาทของ สดท. (สำนักดิจิทัลฯ)</label><br>
                <div class="btn-group" role="group">
                    <input type="radio" class="btn-check" name="roleFilter" id="roleAll" value="all" autocomplete="off" checked onchange="applyFilters()">
                    <label class="btn btn-outline-primary" for="roleAll">ดูทั้งหมด</label>

                    <input type="radio" class="btn-check" name="roleFilter" id="roleHost" value="host" autocomplete="off" onchange="applyFilters()">
                    <label class="btn btn-outline-primary" for="roleHost">H: เจ้าภาพหลัก</label>

                    <input type="radio" class="btn-check" name="roleFilter" id="roleRel" value="relative" autocomplete="off" onchange="applyFilters()">
                    <label class="btn btn-outline-primary" for="roleRel">R: หน่วยงานร่วม</label>
                </div>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold text-muted">ประเภทแผน</label>
                <select id="planTypeFilter" class="form-select" onchange="applyFilters()">
                    <option value="all">ทุกประเภทแผน</option>
                </select>
            </div>
        </div>

        <!-- 3. ตารางข้อมูลแบบซ้อน (Nested Table) -->
        <div class="table-responsive">
            <h5 class="fw-bold mb-3">ความเชื่อมโยงยุทธศาสตร์ (KRs) และ โครงการ</h5>
            <table class="table table-bordered align-middle">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 45%;">ยุทธศาสตร์ / โครงการ</th>
                        <th>ประเภทแผน</th>
                        <th>ผลสำเร็จ (%)</th>
                        <th>งบประมาณ (บาท)</th>
                        <th>เอกสารหลักฐาน</th>
                    </tr>
                </thead>
                <tbody id="projectTableBody">
                    <!-- โค้ดสร้างตารางจะถูกใส่ตรงนี้ -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let globalData = [];
    let cols = {};

    async function fetchData() {
        const year = document.getElementById('yearSelect').value;
        document.getElementById('loading').classList.remove('d-none');
        document.getElementById('dashboardContent').classList.add('d-none');

        try {
            const response = await fetch(`/api/data?year=${year}`);
            const result = await response.json();
            
            if(result.status === 'success') {
                globalData = result.data;
                if(globalData.length > 0) {
                    setupColumns(globalData[0]);
                    populateFilters(globalData);
                    applyFilters(); 
                }
            } else {
                alert("เกิดข้อผิดพลาด: " + result.error);
            }
        } catch (error) {
            console.error(error);
            alert("ไม่สามารถเชื่อมต่อดึงข้อมูลได้");
        } finally {
            document.getElementById('loading').classList.add('d-none');
            document.getElementById('dashboardContent').classList.remove('d-none');
        }
    }

    function setupColumns(row) {
        const keys = Object.keys(row);
        cols = {
            krID: keys.find(k => k.includes('รหัส KRs')) || keys[1],
            krName: keys.find(k => k.includes('KEY RESULT')) || keys[5],
            
            // รองรับทั้งคอลัมน์ชื่อโครงการเก่า และ คอลัมน์ "ชื่อโครงการ" แบบใหม่
            projectName: keys.find(k => k.includes('ชื่อโครงการ') || (k.includes('โครงการ/กิจกรรม') && k.includes('หน่วยงาน'))) || keys[14],
            // รองรับคอลัมน์ "ประเภทของแผน" (ถ้ามี)
            planType: keys.find(k => k.includes('ประเภทของแผน') || k.includes('ประเภทแผน')),
            
            hostDept: keys.find(k => k.includes('หน่วยงาน (H)')),
            relDept: keys.find(k => k.includes('หน่วยงาน (R)')),
            budget: keys.find(k => k.includes('งบประมาณจัดสรร')) || keys[19],
            target: keys.find(k => k.includes('ค่าเป้าหมายของโครงการ')) || keys[16],
            actual: keys.find(k => k.includes('ผลการดำเนินงาน')) || keys[18],
            doc: keys.find(k => k.includes('ลิงก์ไฟล์เอกสาร')) || keys[22]
        };
    }

    function populateFilters(data) {
        const planSelect = document.getElementById('planTypeFilter');
        const plans = new Set();
        
        if(cols.planType) {
            data.forEach(row => {
                let p = row[cols.planType];
                if(p && String(p).trim() !== '') plans.add(String(p).trim());
            });
            planSelect.innerHTML = '<option value="all">ทุกประเภทแผน</option>';
            plans.forEach(p => {
                let opt = document.createElement('option');
                opt.value = p; opt.innerText = p;
                planSelect.appendChild(opt);
            });
        } else {
            planSelect.disabled = true;
            planSelect.innerHTML = '<option>ยังไม่มีคอลัมน์ประเภทแผน</option>';
        }
    }

    // ฟังก์ชันเช็กว่า สดท. เป็น H หรือ R
    function checkRole(row) {
        let hText = String(row[cols.hostDept] || '');
        let rText = String(row[cols.relDept] || '');
        let isH = hText.includes('สดท') || hText.includes('สำนักดิจิทัล');
        let isR = rText.includes('สดท') || rText.includes('สำนักดิจิทัล');
        return { isH, isR };
    }

    function applyFilters() {
        const roleFilter = document.querySelector('input[name="roleFilter"]:checked').value;
        const planFilter = document.getElementById('planTypeFilter').value;
        
        let filteredData = globalData.filter(row => {
            let roleMatch = true;
            let roles = checkRole(row);
            
            // กรองตามบทบาท H/R ของ KR นั้นๆ
            if (roleFilter === 'host' && !roles.isH) roleMatch = false;
            if (roleFilter === 'relative' && !roles.isR) roleMatch = false;

            // กรองประเภทแผน (ถ้ามี)
            let planMatch = true;
            if (planFilter !== 'all' && cols.planType) {
                let pName = String(row[cols.projectName] || '').trim();
                // บรรทัดที่เป็นโครงการเท่านั้นถึงกรองแผน บรรทัด KR เปล่าๆ ให้ปล่อยผ่าน
                if (pName !== '' && String(row[cols.planType] || '').trim() !== planFilter) {
                    planMatch = false;
                }
            }

            return roleMatch && planMatch;
        });

        processDashboardData(filteredData);
    }

    function processDashboardData(data) {
        let krGroups = {}; 

        data.forEach((row) => {
            let krTitle = String(row[cols.krName] || '').trim();
            if(!krTitle || krTitle === 'NaN' || krTitle === 'None') return;

            let krKey = row[cols.krID] || krTitle; 
            let roles = checkRole(row);
            
            if(!krGroups[krKey]) {
                krGroups[krKey] = {
                    title: krTitle,
                    id: row[cols.krID] || '-',
                    isH: roles.isH,
                    isR: roles.isR,
                    projects: [],
                    krBudget: 0
                };
            }

            let pName = String(row[cols.projectName] || '').trim();
            if(pName && pName !== 'NaN' && pName !== 'None') {
                let pBudget = parseFloat(String(row[cols.budget] || '0').replace(/,/g, '')) || 0;
                krGroups[krKey].krBudget += pBudget;

                let pTarget = parseFloat(row[cols.target]) || 1;
                let pActual = parseFloat(row[cols.actual]) || 0;
                let pProgress = Math.min((pActual / pTarget) * 100, 100).toFixed(2);
                let pType = cols.planType ? (row[cols.planType] || '-') : '-';

                krGroups[krKey].projects.push({
                    name: pName,
                    type: pType,
                    budget: pBudget,
                    progress: isNaN(pProgress) ? 0 : pProgress,
                    doc: row[cols.doc]
                });
            }
        });

        let tableHTML = '';
        let krCount = 0;

        for (const key in krGroups) {
            krCount++;
            const group = krGroups[key];
            const hasProjects = group.projects.length > 0;
            const krRowId = `kr-${krCount}`;

            // ป้ายกำกับ บทบาท
            let roleBadge = '';
            if (group.isH) roleBadge += `<span class="badge badge-host ms-2">H: เจ้าภาพหลัก</span>`;
            if (group.isR) roleBadge += `<span class="badge badge-relative ms-2">R: หน่วยงานร่วม</span>`;

            tableHTML += `
                <tr class="kr-row ${hasProjects ? '' : 'text-danger'}" onclick="toggleKR('${krRowId}')">
                    <td colspan="3">
                        <span class="toggle-icon"></span>
                        <span class="badge bg-secondary me-2">${group.id}</span>
                        ${group.title} 
                        ${roleBadge}
                        ${!hasProjects ? '<span class="badge bg-danger ms-2">ยังไม่มีโครงการ</span>' : ''}
                    </td>
                    <td class="text-end fw-bold">${group.krBudget.toLocaleString()}</td>
                    <td></td>
                </tr>
            `;

            group.projects.forEach(proj => {
                let docButton = proj.doc && String(proj.doc).startsWith('http') 
                    ? `<a href="${proj.doc}" target="_blank" class="btn btn-sm btn-outline-primary">📂 เอกสาร</a>`
                    : `<span class="text-muted" style="font-size:0.85em;">-</span>`;

                tableHTML += `
                    <tr class="project-row kr-child-${krRowId}">
                        <td class="ps-5 text-primary">↳ ${proj.name}</td>
                        <td><span class="badge bg-light text-dark border">${proj.type}</span></td>
                        <td>
                            <div class="d-flex align-items-center">
                                <span class="me-2">${proj.progress}%</span>
                                <div class="progress w-100" style="height: 6px;">
                                    <div class="progress-bar ${proj.progress == 100 ? 'bg-success' : 'bg-primary'}" style="width: ${proj.progress}%;"></div>
                                </div>
                            </div>
                        </td>
                        <td class="text-end">${proj.budget.toLocaleString()}</td>
                        <td class="text-center">${docButton}</td>
                    </tr>
                `;
            });
        }

        document.getElementById('projectTableBody').innerHTML = tableHTML;
    }

    function toggleKR(krId) {
        const krRow = document.querySelector(`tr[onclick="toggleKR('${krId}')"]`);
        krRow.classList.toggle('collapsed');
        const children = document.querySelectorAll(`.kr-child-${krId}`);
        children.forEach(child => {
            child.style.display = krRow.classList.contains('collapsed') ? 'none' : 'table-row';
        });
    }

    window.onload = fetchData;
</script>
</body>
</html>
